name: Build and Push Docker Image

on:
  workflow_call:
    inputs:
      app_name:
        required: true
        type: string
      dockerfile_path:
        required: false
        type: string
        default: "./Dockerfile"
    secrets:
      REGISTRY_USERNAME:
        required: true
      REGISTRY_PASSWORD:
        required: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      # Configuration du builder Docker avec support du cache
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Connexion à votre registre privé
      - name: Connexion au Registre Privé
        uses: docker/login-action@v3
        with:
          registry: registry.c-mbk.fr
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      # Build et Push vers votre registre
      - name: Build et Push de l'image Docker
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ inputs.dockerfile_path }}
          push: true
          tags: |
            registry.c-mbk.fr/${{ inputs.app_name }}:${{ github.sha }}
            registry.c-mbk.fr/${{ inputs.app_name }}:latest
