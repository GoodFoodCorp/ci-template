name: Build and Push Docker Image

on:
  workflow_call:
    inputs:
      app_name:
        required: true
        type: string
      dockerfile_path:
        required: false
        type: string
        default: "./Dockerfile"
    secrets:
      REGISTRY_USERNAME:
        required: true
      REGISTRY_PASSWORD:
        required: true
      ORG_PIPELINE_TOKEN:
        required: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      new_tag: ${{ steps.versioning.outputs.new_tag }}
    steps:
      - name: Checkout du code applicatif
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.ORG_PIPELINE_TOKEN }}
          fetch-depth: 0

      - name: Formater le nom de l'image en minuscules
        id: string
        run: |
          APP_NAME_LOWER=$(echo "${{ inputs.app_name }}" | tr '[:upper:]' '[:lower:]')
          echo "app_name_lower=${APP_NAME_LOWER}" >> $GITHUB_OUTPUT

      - name: Calculer le nouveau tag vX.X.X
        id: versioning
        run: |
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          echo "Dernier tag trouvé : $LATEST_TAG"

          VERSION=${LATEST_TAG#v}
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"

          NEW_PATCH=$((PATCH + 1))
          NEW_TAG="v${MAJOR}.${MINOR}.${NEW_PATCH}"

          echo "Nouveau tag généré : $NEW_TAG"
          echo "new_tag=${NEW_TAG}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Connexion au Registre Privé
        uses: docker/login-action@v3
        with:
          registry: registry.c-mbk.fr
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build et Push de l'image Docker
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ inputs.dockerfile_path }}
          push: true
          tags: |
            registry.c-mbk.fr/${{ steps.string.outputs.app_name_lower }}:${{ steps.versioning.outputs.new_tag }}
            registry.c-mbk.fr/${{ steps.string.outputs.app_name_lower }}:latest

      - name: Créer et pousser le tag Git sur le dépôt applicatif
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag ${{ steps.versioning.outputs.new_tag }}
          git push origin ${{ steps.versioning.outputs.new_tag }}

  update-gitops:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du repo GitOps
        uses: actions/checkout@v4
        with:
          repository: "GoodFoodCorp/k3s-gitops"
          token: ${{ secrets.ORG_PIPELINE_TOKEN }}
          ref: "main"

      - name: Mettre à jour le tag image dans le deployment.yaml
        run: |
          APP_NAME_LOWER=$(echo "${{ inputs.app_name }}" | tr '[:upper:]' '[:lower:]')
          NEW_TAG="${{ needs.build-and-push.outputs.new_tag }}"

          TARGET_FILE=$(find apps -type f -path "*/${APP_NAME_LOWER}/deployment.yaml" | head -n 1)

          if [ -n "$TARGET_FILE" ] && [ -f "$TARGET_FILE" ]; then
            echo "Fichier trouvé : $TARGET_FILE"
            echo "Mise à jour de l'image vers le tag $NEW_TAG dans $TARGET_FILE..."
            
            sed -i "s|image: registry.c-mbk.fr/${APP_NAME_LOWER}:.*|image: registry.c-mbk.fr/${APP_NAME_LOWER}:${NEW_TAG}|g" "$TARGET_FILE"
            
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add "$TARGET_FILE"

            # Vérifie s'il y a réellement une modification à commiter
            if git diff --staged --quiet; then
              echo "Le tag $NEW_TAG est déjà appliqué dans $TARGET_FILE. Rien à commiter."
            else
              git commit -m "bump(${APP_NAME_LOWER}): update image tag to ${NEW_TAG}"
              git push origin main
            fi
          else
            echo "Erreur : Impossible de trouver un fichier deployment.yaml pour '${APP_NAME_LOWER}' dans le dossier apps/."
            exit 1
          fi
