name: Build and Push Docker Image

on:
  workflow_call:
    inputs:
      app_name:
        required: true
        type: string
      dockerfile_path:
        required: false
        type: string
        default: "./Dockerfile"
      # Tests run before anything is built or tagged; empty = no test job.
      test_image:
        description: "Image the tests run in (e.g. golang:1.26, node:20, mcr.microsoft.com/dotnet/sdk:8.0)"
        required: false
        type: string
        default: ""
      test_command:
        description: "Shell command running the tests (lint/vet included)"
        required: false
        type: string
        default: ""
      # The image is scanned before it is pushed: a CRITICAL fixable
      # vulnerability blocks the release unless this is false.
      fail_on_vulnerabilities:
        required: false
        type: boolean
        default: true
    secrets:
      REGISTRY_USERNAME:
        required: true
      REGISTRY_PASSWORD:
        required: true
      ORG_PIPELINE_TOKEN:
        required: true

jobs:
  test:
    if: inputs.test_command != ''
    runs-on: ubuntu-latest
    container: ${{ inputs.test_image }}
    steps:
      - name: Checkout du code applicatif
        uses: actions/checkout@v4

      - name: Tests
        run: ${{ inputs.test_command }}

  build-and-push:
    needs: test
    # Runs when the tests passed, or when the service declares none.
    if: always() && (needs.test.result == 'success' || needs.test.result == 'skipped')
    runs-on: ubuntu-latest
    outputs:
      new_tag: ${{ steps.versioning.outputs.new_tag }}
    steps:
      - name: Checkout du code applicatif
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.ORG_PIPELINE_TOKEN }}
          fetch-depth: 0 # Récupère l'historique complet pour trouver les tags

      - name: Formater le nom de l'image en minuscules
        id: string
        run: |
          APP_NAME_LOWER=$(echo "${{ inputs.app_name }}" | tr '[:upper:]' '[:lower:]')
          echo "app_name_lower=${APP_NAME_LOWER}" >> "$GITHUB_OUTPUT"

      # -------------------------------------------------------------
      # ÉTAPE AUTOMATIQUE : Incrémentation et publication du tag vX.X.X
      # -------------------------------------------------------------
      - name: Calculer et publier le nouveau tag vX.X.X
        id: versioning
        run: |
          # S'assure de voir les tags publiés, y compris après un checkout réutilisé.
          git fetch --tags --force origin

          # Récupère le plus grand tag vX.X.X (ou v0.0.0 si aucun tag n'existe)
          LATEST_TAG=$(git tag --list 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1)
          LATEST_TAG=${LATEST_TAG:-v0.0.0}
          echo "Dernier tag trouvé : $LATEST_TAG"

          # Extrait les numéros Majeur, Mineur et Patch
          VERSION=${LATEST_TAG#v}
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Publie le tag afin que le prochain push parte de cette version.
          # En cas de concurrence, le patch suivant est essayé atomiquement.
          NEW_PATCH=$((PATCH + 1))
          while true; do
            NEW_TAG="v${MAJOR}.${MINOR}.${NEW_PATCH}"

            if git ls-remote --exit-code --refs origin "refs/tags/${NEW_TAG}" >/dev/null 2>&1; then
              NEW_PATCH=$((NEW_PATCH + 1))
              continue
            fi

            git tag "${NEW_TAG}" "${GITHUB_SHA}"
            if git push origin "${NEW_TAG}"; then
              break
            fi

            git tag --delete "${NEW_TAG}"
            if git ls-remote --exit-code --refs origin "refs/tags/${NEW_TAG}" >/dev/null 2>&1; then
              NEW_PATCH=$((NEW_PATCH + 1))
              continue
            fi

            echo "Erreur: impossible de publier le tag ${NEW_TAG}."
            exit 1
          done

          echo "Nouveau tag généré et publié : $NEW_TAG"
          echo "new_tag=${NEW_TAG}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Connexion au Registre Privé
        uses: docker/login-action@v3
        with:
          registry: registry.c-mbk.fr
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      # Build local d'abord, pour scanner l'image avant de la publier.
      - name: Build de l'image Docker
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ inputs.dockerfile_path }}
          load: true
          tags: ${{ steps.string.outputs.app_name_lower }}:scan
          cache-to: type=gha,mode=max
          cache-from: type=gha

      - name: Scan de vulnérabilités (Trivy)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ steps.string.outputs.app_name_lower }}:scan
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: ${{ inputs.fail_on_vulnerabilities && '1' || '0' }}

      # Push avec le tag vX.X.X (immuable, référencé par le GitOps) et latest
      - name: Push de l'image Docker
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ inputs.dockerfile_path }}
          push: true
          cache-from: type=gha
          tags: |
            registry.c-mbk.fr/${{ steps.string.outputs.app_name_lower }}:${{ steps.versioning.outputs.new_tag }}
            registry.c-mbk.fr/${{ steps.string.outputs.app_name_lower }}:latest

  # -------------------------------------------------------------
  # Mise à jour du dépôt GitOps avec le tag vX.X.X
  # -------------------------------------------------------------
  update-gitops:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du repo GitOps
        uses: actions/checkout@v4
        with:
          repository: "GoodFoodCorp/k3s-gitops"
          token: ${{ secrets.ORG_PIPELINE_TOKEN }}
          ref: "main"

      - name: Mettre à jour le tag image dans le deployment.yaml
        run: |
          APP_NAME_LOWER=$(echo "${{ inputs.app_name }}" | tr '[:upper:]' '[:lower:]')
          NEW_TAG="${{ needs.build-and-push.outputs.new_tag }}"

          # Recherche automatique du fichier deployment.yaml dans apps/back/ ou apps/front/
          TARGET_FILE=$(find apps -type f -path "*/${APP_NAME_LOWER}/deployment.yaml" | head -n 1)

          if [ -n "$TARGET_FILE" ] && [ -f "$TARGET_FILE" ]; then
            echo "Fichier trouvé : $TARGET_FILE"
            echo "Mise à jour de l'image vers le tag $NEW_TAG dans $TARGET_FILE..."
            
            sed -i "s|image: registry.c-mbk.fr/${APP_NAME_LOWER}:.*|image: registry.c-mbk.fr/${APP_NAME_LOWER}:${NEW_TAG}|g" "$TARGET_FILE"
            
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add "$TARGET_FILE"

            if git diff --staged --quiet; then
              echo "Le tag $NEW_TAG est déjà appliqué dans $TARGET_FILE. Rien à commiter."
              exit 0
            fi

            git commit -m "bump(${APP_NAME_LOWER}): update image tag to ${NEW_TAG}"
            git push
          else
            echo "Erreur: Impossible de trouver un fichier deployment.yaml pour '${APP_NAME_LOWER}' dans le dossier apps/."
            exit 1
          fi
